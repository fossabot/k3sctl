version: 2

builds:
  - main: .
    binary: k3sctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/nirantarasi/k3sctl/version.Version={{.Version}}
      - -X github.com/nirantarasi/k3sctl/version.GitCommit={{.ShortCommit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # k3s publishes linux/amd64, linux/arm64 and linux/armhf only; macOS
      # has no 32-bit arm build.
      - goos: darwin
        goarch: arm

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: nirantarasi
      name: homebrew-k3sctl
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/nirantarasi/k3sctl"
    description: "CLI tool to manage k3s Kubernetes clusters"
    license: "MIT"
    install: |
      bin.install "k3sctl"
    test: |
      system "#{bin}/k3sctl", "version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
